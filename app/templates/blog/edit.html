{% extends "base.html" %}
{% block title %}Edit Post — FreelanceHub Admin{% endblock %}

{% block content %}
<section class="page-hero">
  <div class="container" style="max-width:780px">
    <div class="overline"><a href="{{ url_for('blog.list_posts') }}" style="color:inherit">Blog</a> / Edit Post</div>
    <h1 style="margin-top:8px">Edit <span class="gradient-text">Post</span></h1>
  </div>
</section>
<section class="section">
  <div class="container" style="max-width:780px">
    <div class="card reveal">
      <form method="POST" action="{{ url_for('blog.edit_post', post_id=post.id) }}">
        <div class="form-group">
          <label class="form-label" for="title">Post Title *</label>
          <input type="text" class="form-control" id="title" name="title" value="{{ post.title }}" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="excerpt">Excerpt</label>
          <input type="text" class="form-control" id="excerpt" name="excerpt" value="{{ post.excerpt or '' }}" />
        </div>
        <div class="form-group">
          <label class="form-label" for="tags">Tags (comma-separated)</label>
          <input type="text" class="form-control" id="tags" name="tags" value="{{ post.tags or '' }}" />
        </div>
        <div class="form-group">
          <label class="form-label" for="cover_image">Cover Image URL</label>
          <input type="url" class="form-control" id="cover_image" name="cover_image" value="{{ post.cover_image or '' }}" />
        </div>
        <div class="form-group">
          <label class="form-label" for="content">Content *</label>
          <textarea class="form-control" id="content" name="content" rows="16" required>{{ post.content }}</textarea>
        </div>
        <div class="form-group flex gap-md" style="align-items:center">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:0.9rem;color:var(--text-secondary)">
            <input type="checkbox" name="is_published" id="is_published" {{ 'checked' if post.is_published }} style="accent-color:var(--accent);width:16px;height:16px" />
            Published
          </label>
        </div>
        <div class="flex gap-md" style="flex-wrap:wrap">
          <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Save Changes</button>
          <a href="{{ url_for('blog.post_detail', slug=post.slug) }}" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
