<div class="form-group">
  <label class="form-label">Title *</label>
  <input type="text" class="form-control" name="title" required />
</div>
<div class="form-group">
  <label class="form-label">Short Description *</label>
  <textarea class="form-control" name="description" rows="2" required></textarea>
</div>
<div class="form-group">
  <label class="form-label">Problem Statement</label>
  <textarea class="form-control" name="problem" rows="3" placeholder="What problem did this solve?"></textarea>
</div>
<div class="form-group">
  <label class="form-label">Solution</label>
  <textarea class="form-control" name="solution" rows="3" placeholder="How was it solved?"></textarea>
</div>
<div class="form-group">
  <label class="form-label">Tech Stack (comma-separated)</label>
  <input type="text" class="form-control" name="tech_stack" placeholder="Python, Flask, React, PostgreSQL" />
</div>
<div class="form-row">
  <div class="form-group">
    <label class="form-label">Image URL</label>
    <input type="url" class="form-control" name="image_url" />
  </div>
  <div class="form-group">
    <label class="form-label">Category</label>
    <input type="text" class="form-control" name="category" placeholder="Web App, AI, API..." />
  </div>
</div>
<div class="form-row">
  <div class="form-group">
    <label class="form-label">Live URL</label>
    <input type="url" class="form-control" name="live_url" />
  </div>
  <div class="form-group">
    <label class="form-label">GitHub URL</label>
    <input type="url" class="form-control" name="github_url" />
  </div>
</div>
<div class="form-group flex gap-sm" style="align-items:center;margin-bottom:24px">
  <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:0.9rem;color:var(--text-secondary)">
    <input type="checkbox" name="is_featured" style="accent-color:var(--accent)" />
    Featured project
  </label>
</div>
